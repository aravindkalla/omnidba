# =============================================================================
# Nginx reverse proxy for OmniDBA
#
# Terminates HTTPS (self-signed cert) and proxies:
#   /api/*  →  FastAPI  :8000   (mobile app backend)
#   /*      →  Streamlit :8501  (web UI — stays unchanged)
#
# SETUP (run once as root):
#   1. Generate self-signed cert:        sudo ./generate_ssl.sh
#   2. Install nginx:                    sudo apt-get install nginx -y
#   3. Copy this file:                   sudo cp nginx.conf /etc/nginx/sites-available/oracle-dba
#   4. Enable site:                      sudo ln -sf /etc/nginx/sites-available/oracle-dba \
#                                                    /etc/nginx/sites-enabled/oracle-dba
#   5. Remove default site:              sudo rm -f /etc/nginx/sites-enabled/default
#   6. Test + reload:                    sudo nginx -t && sudo systemctl reload nginx
#
# MOBILE APP NOTE:
#   Self-signed certs require the cert to be trusted on each device.
#   Android: add network_security_config.xml (handled in the React Native app)
#   iOS:     install the .crt on device via Settings → General → VPN & Device Management
#   The cert file is at /etc/ssl/oracle-dba/server.crt after running generate_ssl.sh
#
# PRODUCTION UPGRADE:
#   Replace self-signed cert with Let's Encrypt once you have a domain:
#   sudo certbot --nginx -d yourdomain.com
# =============================================================================

# Redirect all HTTP to HTTPS
server {
    listen      80;
    server_name _;
    return      301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name _;

    # ── TLS ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/ssl/oracle-dba/server.crt;
    ssl_certificate_key /etc/ssl/oracle-dba/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    # ── FastAPI — mobile backend  (/api/* and /docs, /openapi.json) ───────────
    location /api/ {
        rewrite         ^/api/(.*)$ /$1 break;
        proxy_pass      http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;   # LLM inference can take up to 90 s
        proxy_send_timeout 120s;
        client_max_body_size 1M;
    }

    # FastAPI interactive docs (useful during development)
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # ── Streamlit — web UI  (everything else) ────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 120s;
    }

    # Streamlit websocket endpoint
    location /_stcore/stream {
        proxy_pass         http://127.0.0.1:8501/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}
